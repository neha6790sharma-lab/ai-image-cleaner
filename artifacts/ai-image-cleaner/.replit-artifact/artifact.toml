kind = "web"
previewPath = "/"
title = "AI Image Cleaner"
description = "A privacy-first image utility that lets people remove unwanted objects, crop images, convert formats, and generate Indian document photos entirely in the browser with in-memory processing."
version = "1.0.0"
id = "artifacts/ai-image-cleaner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20222

[services.development]
run = "pnpm --filter @workspace/ai-image-cleaner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-image-cleaner", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-image-cleaner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20222"
BASE_PATH = "/"

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: image
    description: In-memory image processing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: health
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inpaint:
    post:
      operationId: inpaintImage
      tags: [image]
      summary: Remove a masked region from an image
      description: Reconstructs a masked region in memory and returns a PNG.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/InpaintInput"
      responses:
        "200":
          description: Processed PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid image, mask, or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Processing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InpaintInput:
      type: object
      properties:
        image:
          type: string
        mask:
          type: string
      required:
        - image
        - mask
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

